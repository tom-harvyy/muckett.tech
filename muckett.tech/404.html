<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found · Muckett</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="stylesheet" href="styles.css">
  <style>
    .not-found { min-height: 70vh; display: grid; place-items: center; text-align: center; padding: 2rem; }
    .not-found .card { background: #fff; padding: 2rem; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,.08); max-width: 720px; }
    .muted { color: #64748b; margin-top: .5rem; }
  </style>
</head>
<body>
  <header class="header">
    <nav class="navbar">
      <div class="nav-container">
        <div class="nav-logo">
          <img src="/logo.png" alt="Muckett logo" class="logo-img" />
          <h2 class="logo-text">Muckett</h2>
        </div>
        <ul class="nav-menu">
          <li class="nav-item"><a href="./" class="nav-link">Home</a></li>
          <li class="nav-item"><a href="services/" class="nav-link">Services</a></li>
          <li class="nav-item"><a href="about/" class="nav-link">About</a></li>
          <li class="nav-item"><a href="contact/" class="nav-link">Contact</a></li>
        </ul>
        <div class="nav-toggle"><span class="bar"></span><span class="bar"></span><span class="bar"></span></div>
      </div>
    </nav>
  </header>

  <main class="not-found">
    <div class="card">
      <h1>Page moved or not found</h1>
      <p class="muted">If you followed an old link with “.html”, we’ll redirect you to the new, cleaner URL.</p>
      <p><a class="btn btn-primary" href="/">Go to homepage</a></p>
    </div>
  </main>

  <script>
    (function() {
      var path = (window.location.pathname || '').toLowerCase();
      var query = window.location.search || '';
      var hash = window.location.hash || '';

      var map = {
        '/index.html': '/',
        '/about.html': '/about/',
        '/contact.html': '/contact/',
        '/services.html': '/services/',
        '/device-repair.html': '/device-repair/',
        '/device-setup.html': '/device-setup/',
        '/website-development.html': '/website-development/'
      };

      if (map[path]) {
        window.location.replace(map[path] + query + hash);
        return;
      }

      if (path.endsWith('.html')) {
        var target = path.slice(0, -5);
        if (target === '/index') target = '/';
        if (!target.endsWith('/')) target += '/';
        window.location.replace(target + query + hash);
      }
    })();
  </script>
</body>
</html>
